<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>네가 보는 동안만</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* VOICE: 비 오는 밤의 쓸쓸한 구원 이야기를 90년대 PC-98 미연시 화면으로
   IDEA: 오래된 PC 게임 화면, 장면 창 + 정보 패널 + 대사창 + 아래 버튼 줄이 액자처럼 짜인 틀
   PICTURE: 도트 배경과 도트 스탠딩이 들어간 장면 창, 금줄 장식이 대사창 위에 걸림
   COLOUR and TYPE: 남색 금속 틀, 밝은 하늘색 테두리, 따뜻한 짚 색 하나 / 16px 도트 글꼴 Unifont
   LAYOUT: 가로 640x400, 세로 360x640 고정 화면을 창 크기에 맞춰 확대 */
@font-face{font-family:"PX";src:url(font/pixel.woff) format("woff");font-display:block}
:root{color-scheme:dark;--fr0:#03060d;--fr1:#0c1630;--fr2:#16264a;--fr3:#2a4677;--hi:#7fa6dc;--hi2:#c9dcf5;--ink:#e8eef8;--dim:#8ea2c4;--blue:#8fd0ff;--straw:#d8b46e}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--fr0);color:var(--ink);overflow:hidden}
body{font:16px/1.5 "PX","Gowun Dodum",monospace;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:none;font-smooth:never}
button{font:16px/1 "PX",monospace;color:var(--ink);cursor:pointer}
#stage{position:fixed;inset:0;overflow:hidden;user-select:none;background:repeating-conic-gradient(#050913 0 25%,#070c18 0 50%) 0 0/4px 4px}
#screen{position:absolute;left:50%;top:50%;width:640px;height:400px;transform-origin:center;background:var(--fr1);box-shadow:0 0 0 2px var(--fr0),0 0 0 4px var(--fr3),0 0 0 6px var(--fr0),0 20px 60px #000}
#screen::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(var(--fr1) 0 25%,var(--fr2) 0 50%) 0 0/2px 2px;opacity:.55}
.pn{position:absolute;background:var(--fr0);border:2px solid;border-color:var(--hi) var(--fr0) var(--fr0) var(--hi);box-shadow:0 0 0 2px var(--fr2),0 0 0 3px var(--fr0),inset 0 0 0 1px var(--fr3)}
#scene{left:8px;top:8px;width:456px;height:257px;overflow:hidden}
#side{left:476px;top:8px;width:156px;height:257px;padding:8px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(var(--fr1),var(--fr0))}
#box{left:8px;top:279px;width:624px;height:90px;padding:10px 14px;cursor:pointer}
#bar{position:absolute;left:8px;top:376px;width:624px;height:18px;display:flex;gap:6px;justify-content:flex-end}
#bar button{flex:0 0 auto;height:18px;padding:0 10px;font-size:12px;letter-spacing:.06em;background:var(--fr2);border:1px solid;border-color:var(--hi) var(--fr0) var(--fr0) var(--hi);color:var(--hi2)}
#bar button:hover,#bar button:focus-visible{background:var(--fr3);color:#fff;outline:none}
#bar button.on{background:var(--hi);color:var(--fr0)}
.bg{position:absolute;inset:0;background:#05070c center/cover no-repeat;image-rendering:pixelated;image-rendering:crisp-edges}
canvas#rain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity 1s}
#sprite{position:absolute;left:50%;bottom:0;height:100%;transform:translateX(-50%);transition:opacity .8s,filter .8s;opacity:0;pointer-events:none}
#sprite,#win img,.face img{image-rendering:pixelated;image-rendering:crisp-edges}
#sprite.on{opacity:1}#sprite.faint{opacity:.55;filter:saturate(.5) brightness(1.15)}
#sprite.glitch{animation:gl .9s steps(2) 1}
@keyframes gl{0%,100%{opacity:1;transform:translateX(-50%)}20%{opacity:.25;transform:translateX(calc(-50% + 6px))}40%{opacity:.8;transform:translateX(calc(-50% - 5px))}60%{opacity:.35}80%{opacity:.7}}
#cg{position:absolute;inset:0;background:#000;opacity:0;transition:opacity 1.2s;pointer-events:none}#cg.on{opacity:1}
#cg img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;image-rendering:crisp-edges}
#screen.port #cg img{height:auto;aspect-ratio:16/9;top:calc(64px + env(safe-area-inset-top))}
#win{position:absolute;overflow:hidden;opacity:0;transition:opacity .8s;pointer-events:none}
#win.on{opacity:1}#win img{position:absolute;left:46%;top:8%;height:240%;transform:translateX(-50%);filter:brightness(.55) saturate(.55) contrast(1.05)}
#win::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 6px,rgba(180,210,255,.12) 6px 7px),linear-gradient(rgba(18,32,70,.35),rgba(4,8,22,.55));box-shadow:inset 0 0 18px 6px rgba(3,6,16,.85);z-index:2}
#win::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3.6%;background:#141d33;z-index:3;box-shadow:1px 0 0 #2a3a5c}
.lbl{font-size:12px;color:var(--dim);letter-spacing:.1em;line-height:1}
.val{font-size:16px;color:var(--ink);line-height:1.2}
.cell{background:var(--fr0);border:1px solid;border-color:var(--fr0) var(--fr3) var(--fr3) var(--fr0);padding:4px 6px}
.face{position:relative;flex:1;background:#060b18;border:2px solid;border-color:var(--fr0) var(--hi) var(--hi) var(--fr0);overflow:hidden;min-height:0}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .3s}
.face img.dim{opacity:.45}
.face .nm{position:absolute;left:0;right:0;bottom:0;text-align:center;background:var(--fr2);border-top:1px solid var(--hi);font-size:14px;color:var(--hi2);line-height:20px}
.face .ph{position:absolute;inset:14px 24px 26px;background:#cfd8e6;border:3px solid #101828;border-radius:2px;color:#101828;display:none;place-content:center;text-align:center;font-size:14px}
.face.call .ph{display:grid}.face.call img{opacity:0}
.dday{display:flex;justify-content:space-between;align-items:center}
.dday b{font-weight:400;color:#ff8f8f}
#line{margin:0;white-space:pre-wrap}
#name{color:var(--blue)}#name:not(:empty)::before{content:"【"}#name:not(:empty)::after{content:"】"}
#text.mono{color:#b9c6dc}
#next{position:absolute;right:10px;bottom:6px;color:var(--blue);font-size:12px;animation:bob 1s steps(2) infinite;opacity:0}#next.on{opacity:1}
@keyframes bob{50%{transform:translateY(2px)}}
#choices{position:absolute;inset:0;display:none;place-content:center;background:rgba(3,6,13,.55);z-index:6;padding:12px}
#choices.on{display:grid}
#choices .cbox{background:var(--fr0);border:2px solid;border-color:var(--hi) var(--fr0) var(--fr0) var(--hi);box-shadow:0 0 0 2px var(--fr2),0 0 0 3px var(--fr0);padding:8px;display:flex;flex-direction:column;gap:4px;min-width:300px}
#choices button{text-align:left;padding:6px 10px 6px 26px;min-height:32px;background:transparent;border:1px solid transparent;position:relative;color:var(--ink)}
#choices button:hover,#choices button:focus-visible{background:var(--fr2);border-color:var(--hi);outline:none}
#choices button:hover::before,#choices button:focus-visible::before{content:"▶";position:absolute;left:8px;color:var(--straw);animation:blink 1s steps(1) infinite}
#timer{height:4px;background:var(--straw);width:100%;transform-origin:left;margin-bottom:4px}
#phone{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:220px;background:#cfd8e6;color:#101828;border:2px solid #101828;box-shadow:0 0 0 2px #6b8bb8,4px 4px 0 #000;padding:6px 10px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:4}
#phone.on{opacity:1}#phone b{display:block;font-weight:400;font-size:12px;color:#3c5a8a;border-bottom:1px dashed #3c5a8a;margin-bottom:4px}
#phone.call{background:#14301f;color:#c8f0d0;text-align:center;border-color:#071a0e;box-shadow:0 0 0 2px #4fa16b,4px 4px 0 #000}#phone.call b{color:#7fd89a;border-color:#7fd89a}
.over{position:absolute;inset:0;z-index:10;display:none}
.over.on{display:block}
#log,#end{background:var(--fr1);padding:10px}
#log .inner,#end .inner{position:relative;height:100%;overflow-y:auto;background:var(--fr0);border:2px solid;border-color:var(--hi) var(--fr0) var(--fr0) var(--hi);padding:12px 16px}
#log p{margin:0 0 8px}#log p span{color:var(--blue)}#log p span::before{content:"【"}#log p span::after{content:"】"}
#log .x{position:absolute;right:16px;top:14px;z-index:2;height:22px;padding:0 10px;background:var(--fr2);border:1px solid;border-color:var(--hi) var(--fr0) var(--fr0) var(--hi);color:var(--hi2)}
#end h2{font:400 24px/1.2 "PX";margin:0 0 4px;color:var(--hi2)}
#end .sub{color:var(--dim);margin:0 0 10px}
.meter{margin:10px 0}.meter div{display:flex;justify-content:space-between}
.bar{height:8px;background:#1a2333;margin-top:4px;border:1px solid var(--fr3)}.bar i{display:block;height:100%}
#end blockquote{margin:12px 0;padding:8px 12px;border-left:3px solid var(--straw);color:#cfd7e3;background:var(--fr1)}
#end .row{display:flex;gap:8px;flex-wrap:wrap}
#end .row button{height:26px;padding:0 12px;background:var(--fr2);border:1px solid;border-color:var(--hi) var(--fr0) var(--fr0) var(--hi);color:var(--hi2)}
#screen.port{left:0;top:0;width:100%;height:100%;transform:none!important;box-shadow:none;background:none}
#screen.port::before{display:none}
#screen.port #scene{left:0;top:0;width:100%;height:100%;border:0;box-shadow:none}
#screen.port #sprite{height:84%}
#screen.port #side{left:10px;top:max(10px,env(safe-area-inset-top));width:auto;height:auto;flex-direction:row;padding:4px;gap:4px;background:rgba(3,6,13,.82)}
#screen.port .face{display:none}
#screen.port .info{flex-direction:row;gap:4px}
#screen.port .cell{padding:3px 6px}#screen.port .lbl{font-size:11px}#screen.port .val{font-size:14px}
#screen.port .dday{gap:6px}
#screen.port #box{left:10px;right:10px;width:auto;top:auto;bottom:calc(60px + env(safe-area-inset-bottom));height:auto;min-height:156px;padding:16px 16px 22px;font-size:17px;line-height:1.65;background:repeating-conic-gradient(rgba(10,18,40,.9) 0 25%,rgba(6,11,26,.9) 0 50%) 0 0/4px 4px}
#screen.port #bar{left:10px;right:10px;width:auto;top:auto;bottom:calc(10px + env(safe-area-inset-bottom));height:42px;justify-content:space-between}
#screen.port #bar button{flex:1;height:42px;font-size:13px}
#screen.port #choices .cbox{min-width:0;width:100%}
#screen.port #choices button{min-height:46px;font-size:17px}
.info{display:flex;flex-direction:column;gap:6px}
#press{position:absolute;left:0;right:0;top:var(--menu-top,70%);text-align:center;font:clamp(11px,2.1vw,17px)/44px "Press Start 2P",monospace;color:#cfe2ff;letter-spacing:.08em;text-shadow:2px 2px 0 #071233;z-index:3;animation:blink 1.2s steps(1) infinite;cursor:pointer}
#title.wait .tmenu{visibility:hidden}
#title:not(.wait) #press{display:none}
@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#title{background:#02040a}
#tcv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#title::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.28) 2px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75) 100%)}
.tmenu{position:absolute;left:50%;top:var(--menu-top,70%);transform:translateX(-50%);display:flex;flex-direction:column;align-items:flex-start;gap:clamp(10px,2.2vh,18px);z-index:2}
.tmenu button{font:clamp(11px,2.1vw,17px)/1 "Press Start 2P",monospace;color:#9fbde6;background:none;border:0;min-height:44px;padding:0 0 0 1.6em;position:relative;letter-spacing:.06em;text-shadow:2px 2px 0 #071233}
.tmenu button:hover,.tmenu button:focus-visible{color:#eaf4ff;outline:none}
.tmenu button:hover::before,.tmenu button:focus-visible::before{content:"▶";position:absolute;left:0;color:#7cc4ff;animation:blink 1s steps(1) infinite}
.tfoot{position:absolute;left:0;right:0;bottom:max(16px,4vh);text-align:center;font:clamp(8px,1.4vw,11px)/2 "Press Start 2P",monospace;color:#4f6f9f;letter-spacing:.08em;z-index:2;text-shadow:1px 1px 0 #030714}
</style>
</head>
<body>
<div id="stage">
 <div id="screen">
  <div class="pn" id="scene">
    <div class="bg" id="bg"></div>
    <canvas id="rain"></canvas>
    <div id="win"><img src="img/h_excited.png" alt=""></div>
    <img id="sprite" alt="">
    <div id="cg"><img id="cgimg" alt=""></div>
    <div id="phone"></div>
    <div id="choices"></div>
  </div>
  <div class="pn" id="side">
    <div class="face" id="pface"><img id="pimg" alt=""><div class="ph" id="pph"></div><div class="nm" id="pname"></div></div>
    <div class="info">
      <div class="cell"><div class="lbl">장소</div><div class="val" id="sLoc">-</div></div>
      <div class="cell"><div class="lbl">시각</div><div class="val" id="sTime">-</div></div>
      <div class="cell dday"><span class="lbl">LEET</span><b id="sDday">D-42</b></div>
    </div>
  </div>
  <div class="pn" id="box" role="button" tabindex="0" aria-label="다음 대사"><p id="line"><span id="name"></span><span id="text"></span></p><span id="next">▼</span></div>
  <div id="bar"><button id="bAuto">AUTO</button><button id="bLog">LOG</button><button id="bSnd">SOUND</button><button id="bTitle">TITLE</button></div>
  <div class="over" id="log"><button class="x" id="bLogX">CLOSE</button><div class="inner" id="logIn"></div></div>
  <div class="over" id="end"><div class="inner" id="endIn"></div></div>
 </div>
  <div class="over on wait" id="title">
    <canvas id="tcv" aria-label="네가 보는 동안만" role="img"></canvas>
    <div class="tmenu"><button id="bNew" aria-label="처음부터">NEW GAME</button><button id="bCont" aria-label="이어하기" hidden>CONTINUE</button></div>
    <div id="press">TOUCH TO START</div>
    <div class="tfoot">CHAPTER 1 DEMO<br>A FANTASY BL VISUAL NOVEL</div>
  </div>
</div>

<script>
{
const H='H';
const S=[
{bg:'study',rain:0,sprite:'y_tired',dday:44},
{t:'아홉 시 사십 분. 지금 나가면 열 시 통금에 딱 맞는다.'},
{t:'늘 딱 맞춰서 산다. 그게 제일 안전하니까.'},
{sfx:'buzz',phone:['엄마','오늘 몇 페이지 했어? 사진 찍어 보내.']},
{sprite:'y_forced',t:'펼쳐만 둔 문제집을 찍는다. 각도를 잘 잡으면 공부한 것처럼 보인다.'},
{t:'이런 건 이제 아주 잘한다.',phone:null},
{t:'독서실 412번 칸. 칸막이 너머에서 누가 형광펜 뚜껑을 닫는 소리가 난다.\n여기 사람들은 서로 얼굴을 모른다. 그래서 편하다.'},
{t:'가방 안쪽 주머니에 약통이 있다. 저녁 약은 아까 먹었다. 먹었던가.\n먹은 걸로 하자. 그게 제일 안전하니까.'},
{t:'의자를 밀어 넣는다. 스탠드를 끈다. 지우개 가루를 손날로 쓸어 담는다. 순서는 매일 같다.'},
{bg:'alley',rain:1,sprite:null},
{t:'버스를 놓쳤다. 이 골목으로 가로지르면 7분이 빠르다.'},
{t:'철거를 앞둔 동네라 가로등이 반쯤 나가 있다. 엄마는 이 길로 다니지 말라고 했다.\n엄마가 모르는 7분은, 내가 가진 몇 안 되는 것 중 하나다.'},
{t:'……여긴 원래 작은 사당이 있던 자리였는데.'},
{t:'어릴 때 이 근처에 살았다. 할머니 손을 잡고 이 앞을 지나가면, 할머니는 꼭 고개를 한 번 숙였다.\n왜 그러냐고 물으면, 여기 계신 분한테 인사하는 거라고 했다.'},
{n:H,t:'……배고프다.'},
{t:'아무도 없다. 없어야 한다.'},
{choice:[{t:'못 들은 척 걷는다',set:{mask:1},go:'c1a'},{t:'소리 난 쪽을 돌아본다',set:{trust:1},go:'c1b'}]},
{label:'c1a'},{t:'걸음을 빨리한다. 빗소리만 듣는다. 빗소리만.'},{go:'m1'},
{label:'c1b'},{t:'돌아보고 말았다. 고개가 먼저 움직였다.'},
{label:'m1',bg:'shrine'},
{n:H,t:'아, 진짜 배고프다. 백 년은 굶은 것 같아.'},
{sfx:'appear',sprite:'h_base',faint:1,t:'무너진 돌계단 위에 누가 쭈그려 앉아 있다. 흠뻑 젖은 머리. 누가 버린 패딩. 맨발.'},
{n:H,t:'……어?'},
{sprite:'h_excited',n:H,t:'너, 지금 나 봤지? 눈 마주쳤지?'},
{n:'윤재',f:'fluster',t:'……아뇨.'},
{n:H,t:'봤잖아! 와, 몇 년 만이야!'},
{t:'벌떡 일어나 다가온다. 키가 너무 크다.'},
{n:H,t:'와, 진짜 보는구나. 내가 움직이니까 눈동자가 따라와. 신기하다.'},
{n:'윤재',f:'annoyed',t:'……비켜 주세요. 저 시간 없어요.'},
{n:H,t:'시간? 시간이라면 나 많은데. 한 백 년쯤.'},
{t:'보지 마. 대답하지 마.\n이건 예전에 그만둔 거다. 이제 다 나았다고, 선생님도 엄마도 그렇게 말했다.'},
{n:H,t:'그거 뭐야? 봉지에 든 거.'},
{t:'편의점 도시락이다. 저녁 먹을 시간이 없어서 사뒀다.'},
{choice:[{t:'도시락을 내민다',set:{trust:1},go:'c2a'},{t:'무시하고 지나친다',set:{mask:1},go:'c2b'}]},
{label:'c2a'},{n:H,t:'……나 주는 거야? 진짜로?'},{t:'두 손으로 받는다. 손끝이 차갑다.'},{n:H,t:'고마워. 이런 거 받아본 지 진짜 오래됐어.'},{go:'m2'},
{label:'c2b'},{t:'봉지가 가벼워졌다.'},{n:H,t:'미안, 너무 배고파서. 나중에 갚을게.'},{n:H,t:'……신이 갚는 건 꽤 크다?'},
{label:'m2'},
{t:'그는 돌계단에 다시 쪼그려 앉아 도시락 뚜껑을 연다. 젓가락 쥐는 손이 서툴다.'},
{n:H,t:'이 노란 거 뭐야? 계란? 와, 계란 진짜 오랜만이다.'},
{t:'신이라는 사람이 편의점 계란말이를 두 번에 나눠 먹는다. 아껴 먹는 거다.\n빗물이 반찬 위로 떨어지는데도, 그는 뚜껑을 덮을 생각을 안 한다.'},
{n:H,t:'너 이 동네 살아?'},

{n:'윤재',f:'forced',t:'네.'},

{bg:'',rain:0,sprite:null,faint:0,time:'PM 02:10',t:'상담실. 하얀 벽, 티슈 상자, 소리 없이 가는 시계.'},
{t:'선생님은 엄마에게 잠깐 밖에서 기다려 달라고 했다. 문이 닫히자 방이 넓어졌다.'},
{n:'선생님',t:'윤재 씨. 여기서 한 말은 어머님께 그대로 전하지 않아요. 그건 약속할게요.'},
{n:'선생님',t:'요즘, 어때요?'},
{t:'대답은 준비해 왔다. 백 번쯤 연습했다. 괜찮아요. 잘 자요. 아무것도 안 보여요.\n입을 열었는데, 붕어빵 냄새가 생각났다.'},
{choice:[{t:'"……괜찮아요. 잘 자요."',set:{mask:1},go:'c6ca'},{t:'"……요즘, 누가 보여요."',set:{trust:1},go:'c6cb'}],timer:7,def:0},
{label:'c6ca'},{n:'선생님',t:'그래요. 다행이네요.'},{t:'선생님은 고개를 끄덕이며 뭔가 적었다. 그 펜 소리가 꼭, 문 닫히는 소리 같았다.'},{go:'m6c'},

{t:'무섭냐고 묻지 않았다. 없애야 하냐고 묻지도 않았다. 어떤 사람이냐고 물었다.'},

{bg:'hall',sprite:null,faint:0,time:'PM 05:10',t:'오후 다섯 시. 상담을 마치고 돌아오는 길.'},
{cond:['susp',3],go:'c14s'},
{t:'상담 선생님은 친절했다. 요즘 어떤지, 잠은 잘 자는지 물었다.\n나는 모범 답안처럼 대답했다. 엄마는 돌아오는 내내 기분이 좋았다.'},{go:'m14'},
{label:'c14s'},
{t:'상담 선생님은 친절했다. 엄마가 먼저 많은 걸 말했다. 혼잣말, 이불, 밤마다 들리는 목소리.\n선생님은 다음 주에 한 번 더 오자고 했다. 엄마는 돌아오는 내내 아무 말도 하지 않았다.'},
{label:'m14'},
{t:'복도 끝 센서등 아래, 하랑이 쪼그려 앉아 기다리고 있었다.\n상담실엔 따라 들어오지 않았다. 들어가면 안 될 것 같았대.'},

{bg:'room',sprite:'h_base',time:'PM 09:30',t:'토요일 밤. 저녁을 거의 먹지 못했다.'},

{n:'아빠',t:'윤재야. 잠깐 들어가도 되냐.'},
{t:'아빠는 내 방에 거의 들어오지 않는다. 들어와도 문턱 근처에만 서 있다. 오늘도 그랬다.\n그가 이불을 끌어안고 벽 쪽으로 비켜 선다. 아빠는 그 자리를 그대로 지나쳐 의자에 앉는다.'},
{n:'아빠',t:'엄마가 걱정 많이 한다. 알지.'},
{n:'윤재',f:'base',t:'……네.'},
{n:'아빠',t:'엄마는 무서워서 그래. 네가 어릴 때 많이 아팠잖아. 그때 엄마가 제일 많이 울었다.'},
{n:'아빠',t:'그러니까 엄마 너무 미워하지는 말고.'},

{n:'아빠',t:'……그리고. 너 하고 싶은 거 있으면, 아빠한테는 말해도 된다.'},
{t:'아빠는 그 말을 하고 바로 일어났다. 하고 나서 스스로 놀란 얼굴이었다.\n문이 닫히고 나서도, 그 말이 의자 위에 남아 있었다.'},
{sprite:'h_excited',n:H,t:'아빠 좋은 사람이다.'},
{n:'윤재',f:'base',t:'……말이 적은 사람이에요.'},

{bg:'room',sprite:'h_base',time:'PM 03:00',dday:38,t:'일요일 오후. 외출 금지 첫날.'},
{t:'엄마는 거실에 있다. 문은 반쯤 열어두라고 했다. 나는 책상에, 그는 바닥에 있다.'},
{n:H,t:'윤재야. 이불 각 잡는 거, 지금 가르쳐 줘.'},
{n:'윤재',f:'base',t:'……갑자기요?'},
{n:H,t:'갑자기 아니야. 어제부터 계속 연습했어. 안 돼서 그렇지.'},
{t:'소리 내지 않고 손으로만 보여줬다. 모서리를 접고, 안으로 밀어 넣고, 손날로 누른다.\n그는 내 손을 따라 한다. 세 번 만에, 모서리가 맞았다.'},
{sprite:'h_excited',n:H,t:'됐다! 봐! 네 침대랑 똑같아!'},
{t:'엄마가 문틈으로 들여다봤다. 바닥에 칼같이 개켜진 이불 한 채.\n엄마는 고개를 갸웃하더니, 그냥 지나갔다.'},
{sprite:'h_base',n:H,t:'……내가 없어져도, 이 각은 남겠다.'},
{n:'윤재',f:'tired',t:'그런 말 하지 마요.'},

{bg:'shrine',sprite:'h_base',time:'PM 11:40',t:'일요일 밤. 철거 하루 전.'},
{t:'엄마 방 불이 꺼진 걸 확인하고 나왔다. 신발 끈을 묶는 손이 떨렸다.\n이것도 처음이다. 요즘은 처음인 게 너무 많다.'},
{t:'사당 앞에 굴착기 두 대가 서 있다. 노란 팔이 달빛 아래 접혀 있다. 내일 아침이면 저 팔이 펴진다.'},
{condgt:['mask','trust'],go:'c15f'},

{t:'하랑의 손끝이 가로등 불빛을 그대로 통과한다. 그는 자기 손을 신기하다는 듯 내려다본다.'},

{choice:[{t:'"……갈게요. 꼭."',set:{trust:1},go:'c16a'},{t:'"……약속은 못 해요."',set:{mask:1},go:'c16b'}]},

{label:'c16b',sprite:'h_sad'},{n:H,t:'……그래. 그래도 기다릴게. 기다리는 건 잘해. 삼 년 했어.'},

{bg:'room',rain:1,sprite:null,faint:0,time:'AM 04:10',dday:37,t:'월요일 새벽 네 시. 한숨도 못 잤다.'},

{n:'엄마',t:'윤재야. 아침 먹어라. 오늘은 집에서 공부하고.'},
{t:'엄마가 쟁반을 들고 방에 들어온다. 방에서 밥을 먹게 하는 건 처음이다.\n밥, 국, 계란말이. 엄마는 의자에 앉지 않고 침대 끝에 걸터앉는다.'},
{n:'엄마',t:'어제 선생님이 엄마한테도 물어보시더라. 엄마는 뭐가 제일 무섭냐고.'},
{n:'엄마',t:'너 할머니 기억나지. 엄마의 엄마.'},
{n:'엄마',t:'할머니도 보인다고 했어. 그 사당 앞에서 맨날 누구한테 인사하고. 동네 사람들이 다 수군거렸어.'},
{n:'엄마',t:'엄마는 그게 너무 창피했어. 그래서 너는, 그런 소리 안 듣고 살았으면 했어.'},
{t:'처음 듣는 얘기였다. 엄마가 엄마의 엄마 얘기를 하는 것도, 무섭다는 말을 하는 것도.'},
{n:'엄마',t:'……밥 먹어. 식기 전에.'},
{t:'엄마가 나간다. 계란말이를 집었다. 두 번에 나눠서 먹었다.\n왜 그렇게 먹었는지는, 알 것 같았다.'},
{t:'시계를 본다. 여덟 시 사십 분. 사당까지 뛰면 십오 분.\n현관 앞엔 엄마가 있다. 엄마는 오늘 출근하지 않았다.'},

const $=id=>document.getElementById(id);
const st={i:0,mask:0,trust:0,susp:0,named:0,bg:'',rain:0,sprite:null,faint:0,phone:null,call:null,win:0,log:[]};
const labels={};S.forEach((n,i)=>{if(n.label)labels[n.label]=i});
let typing=null,full='',busy=false;

const save=()=>{try{localStorage.setItem('hr-save',JSON.stringify(st))}catch(e){}};
const load=()=>{try{return JSON.parse(localStorage.getItem('hr-save')||'null')}catch(e){return null}};

const LOC={study:['독서실','PM 09:40'],alley:['재개발 골목','PM 09:51'],shrine:['옛 사당 터','PM 09:54'],hall:['아파트 13층','PM 10:00'],room:['윤재의 방','PM 10:01'],oneroom:['작은 원룸','PM 07:00']};
let yFace='base',autoOn=false,autoT=null;
function portrait(kind,who){const f=$('pface'),im=$('pimg'),nm=$('pname');f.classList.toggle('call',kind==='m');
  if(kind==='m'){$('pph').textContent=who;nm.textContent=who;return}
  if(kind==='h'){const hs=st.win?'h_excited':(st.sprite&&st.sprite[0]!=='y'?st.sprite:'h_base');im.src='img/f_'+hs+'.png';im.classList.toggle('dim',!!st.faint);nm.textContent=who;return}
  im.src='img/f_y_'+yFace+'.png';im.classList.toggle('dim',!who);nm.textContent='윤재'}
function fit(){const port=innerWidth/innerHeight<.9,sc=$('screen');sc.classList.toggle('port',port);const W=port?360:640,Hh=port?640:400;
  const k=Math.min(innerWidth/W,innerHeight/Hh)*.98;sc.style.transform=port?'':`translate(-50%,-50%) scale(${k})`;if(st.win)placeWin();try{rs()}catch(e){}}
function scheduleAuto(){clearTimeout(autoT);if(autoOn&&!busy&&!typing)autoT=setTimeout(()=>{if(autoOn&&!busy&&!typing&&!$('title').classList.contains('on'))advance()},1400+full.length*45)}
function placeWin(){const sc=$('scene'),vw=sc.clientWidth,vh=sc.clientHeight,k=Math.max(vw/320,vh/180),ox=(vw-320*k)/2,oy=(vh-180*k)/2,w=$('win').style;
  w.left=ox+98.8*k+'px';w.top=oy+13.6*k+'px';w.width=117.4*k+'px';w.height=69.4*k+'px'}
addEventListener('resize',()=>{if(st.win)placeWin()});
function render(){
  if($('bg').dataset.k!==st.bg){$('bg').dataset.k=st.bg;$('bg').style.backgroundImage=st.bg?`url(bg/${st.bg}.png)`:'none'}
  $('rain').style.opacity=st.rain?1:0;
  const sp=$('sprite');
  if(st.sprite){if(!sp.src.endsWith(st.sprite+'.png'))sp.src='img/'+st.sprite+'.png';sp.classList.add('on')}else sp.classList.remove('on');
  sp.classList.toggle('faint',!!st.faint);
  if(st.win)placeWin();
  scene();
  const L=LOC[st.bg]||['-','-'];$('sLoc').textContent=L[0];$('sTime').textContent=st.call?'PM 09:58':(st.time||L[1]);$('sDday').textContent=st.dday==null?'D-42':(st.dday>0?'D-'+st.dday:'—');
  const cg=$('cg');if(st.cg){const u='cg/'+st.cg+'.png';if(!$('cgimg').src.endsWith(u))$('cgimg').src=u;cg.classList.add('on')}else cg.classList.remove('on');
  $('win').classList.toggle('on',!!st.win);if(st.win)sp.classList.remove('on');
  const ph=$('phone');
  if(st.call){ph.className='on call';ph.innerHTML='<b>수신 중</b>'+st.call}
  else if(st.phone){ph.className='on';ph.innerHTML='<b>'+st.phone[0]+'</b>'+st.phone[1]}
  else ph.className='';
}

function apply(n){
  if('bg' in n&&n.bg!==st.bg){st.time=null;st.cg=null}
  ['bg','rain','sprite','faint','phone','call','win','named','time','dday','cg'].forEach(k=>{if(k in n)st[k]=n[k]});
  if(n.sfx)sfx(n.sfx);
  if(n.fx==='glitch'){sfx('glitch');const sp=$('sprite');sp.classList.remove('glitch');void sp.offsetWidth;sp.classList.add('glitch')}
}

function step(){
  while(st.i<S.length){
    const n=S[st.i];apply(n);render();
    if(n.cond){if((st[n.cond[0]]||0)>=n.cond[1]){st.i=labels[n.go]}else st.i++;continue}
    if(n.condgt){if((st[n.condgt[0]]||0)>(st[n.condgt[1]]||0)){st.i=labels[n.go]}else st.i++;continue}
    if(n.go){st.i=labels[n.go];continue}
    if(n.choice){showChoice(n);return}
    if(n.end){showEnd(n);return}
    if(n.t){say(n);save();return}
    st.i++;
  }
}

function say(n){
  const who=n.n===H?(st.named?'하랑':'???'):(n.n||'');
  if(n.f)yFace=n.f;portrait(n.n===H?'h':(n.n&&n.n!=='윤재')?'m':'y',who);
  $('name').textContent=who;
  const tx=$('text');tx.className=who?'':'mono';
  full=n.t;tx.textContent='';$('next').classList.remove('on');
  st.log.push([who,n.t]);if(st.log.length>200)st.log.shift();
  let k=0;clearInterval(typing);
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduce){tx.textContent=full;$('next').classList.add('on');typing=null;return}
  typing=setInterval(()=>{k++;tx.textContent=full.slice(0,k);if(who)typeBlip();if(k>=full.length){clearInterval(typing);typing=null;$('next').classList.add('on');scheduleAuto()}},32);
}

function advance(){
  if(busy||$('title').classList.contains('on'))return;
  if(typing){clearInterval(typing);typing=null;$('text').textContent=full;$('next').classList.add('on');return}
  st.i++;step();
}

let tmr=null,tTick=null;
function showChoice(n){
  busy=true;const c=$('choices');
  c.innerHTML=(n.timer?'<div id="timer"></div>':'')+n.choice.map((o,j)=>`<button data-j="${j}" data-k="${Object.keys(o.set)[0]}">${o.t}</button>`).join('');
  c.classList.add('on');sfx('choice');
  const pick=j=>{clearTimeout(tmr);clearInterval(tTick);sfx('pick');const o=n.choice[j];for(const k in o.set)st[k]+=o.set[k];c.classList.remove('on');busy=false;st.log.push(['선택',o.t]);st.i=labels[o.go];step()};
  c.querySelectorAll('button').forEach(b=>b.onclick=e=>{e.stopPropagation();pick(+b.dataset.j)});
  if(n.timer){tTick=setInterval(()=>sfx('tick'),1000);const t=$('timer');t.animate([{transform:'scaleX(1)'},{transform:'scaleX(0)'}],{duration:n.timer*1000,fill:'forwards'});tmr=setTimeout(()=>pick(n.def),n.timer*1000)}
  c.querySelector('button').focus();
}

function showEnd(n){
  const clear=st.trust>=st.mask,[mm,mt]=n.max,last=n.final||!S[st.i+1];
  let got=[];try{got=JSON.parse(localStorage.getItem('hr-endings')||'[]')}catch(e){}
  if(n.ending&&!got.includes(n.ending)){got.push(n.ending);try{localStorage.setItem('hr-endings',JSON.stringify(got))}catch(e){}}
  const ALL=['두 사람 몫의 사당','비밀 동거','완벽한 아들','신의 몫'];
  $('endIn').innerHTML=`<h2>${n.ch}</h2><p class="sub">${n.ending?n.kind:'— '+n.end+'장 끝 —'}</p>
  <div class="meter"><div><span>가면</span><span>${st.mask} / ${mm}</span></div><div class="bar"><i style="width:${Math.min(100,st.mask/mm*100)}%;background:#9aa6b8"></i></div></div>
  <div class="meter"><div><span>믿음</span><span>${st.trust} / ${mt}</span></div><div class="bar"><i style="width:${Math.min(100,st.trust/mt*100)}%;background:var(--blue)"></i></div></div>
  <blockquote>${clear?n.good:n.bad}</blockquote>
  <p>${last?n.next:'다음: '+n.next}</p>${n.ending?`<p class="sub">엔딩 수집 ${got.length} / 4 · ${ALL.map(e=>got.includes(e)?e:'???').join(' · ')}</p>`:''}
  <div class="row">${last?'':'<button id="bNext">다음 장으로 ▶</button>'}<button id="bAgain">처음부터 다시</button><button id="bHome">타이틀로</button></div>`;
  $('end').classList.add('on');sfx('end');scene();
  if(!last){st.i++;save();$('bNext').onclick=()=>{$('end').classList.remove('on');scene();step()};$('bNext').focus()}
  else{try{localStorage.removeItem('hr-save')}catch(e){}}
  $('bAgain').onclick=()=>{$('end').classList.remove('on');start()};
  $('bHome').onclick=()=>{$('end').classList.remove('on');toTitle()};
}

function start(saved){
  Object.assign(st,{i:0,mask:0,trust:0,susp:0,named:0,bg:'',rain:0,sprite:null,faint:0,phone:null,call:null,win:0,time:null,dday:42,cg:null,log:[]},saved||{});
  $('title').classList.remove('on');auStart();
  if(saved){apply({});render();const n=S[st.i];if(n&&n.t)say(n);else step()}else step();
}
function toTitle(){clearInterval(typing);$('title').classList.add('on');scene();$('bCont').hidden=!load();tLast=0;setTimeout(()=>$('bNew').focus({preventScroll:true}),50)}

$('box').onclick=advance;
$('scene').addEventListener('click',e=>{if(!e.target.closest('#choices'))advance()});
addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){if(document.activeElement&&document.activeElement.tagName==='BUTTON')return;e.preventDefault();advance()}});
$('bNew').onclick=()=>start();

$('bAuto').onclick=e=>{e.stopPropagation();autoOn=!autoOn;$('bAuto').classList.toggle('on',autoOn);scheduleAuto()};

/* ---- 소리: 전부 브라우저에서 합성 ---- */
const AU={ctx:null,on:true,started:false,nextBeat:0,step:0,timer:null,tick:null,ring:null};
try{AU.on=localStorage.getItem('hr-sound')!=='off'}catch(e){}
const N=m=>440*Math.pow(2,(m-69)/12);
function auInit(){
  if(AU.ctx)return true;const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;
  const c=AU.ctx=new C();AU.master=c.createGain();AU.master.gain.value=AU.on?.9:0;AU.master.connect(c.destination);
  AU.comp=c.createDynamicsCompressor();AU.comp.connect(AU.master);
  // 잔향 (짧은 노이즈 임펄스)
  const len=c.sampleRate*2.4,ir=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
  AU.verb=c.createConvolver();AU.verb.buffer=ir;AU.verbIn=c.createGain();AU.verbIn.gain.value=.5;AU.verbIn.connect(AU.verb);AU.verb.connect(AU.comp);
  AU.music=c.createGain();AU.music.gain.value=0;AU.music.connect(AU.comp);AU.music.connect(AU.verbIn);
  AU.sfx=c.createGain();AU.sfx.gain.value=.8;AU.sfx.connect(AU.comp);
  // 빗소리
  const nb=c.createBuffer(1,c.sampleRate*3,c.sampleRate),nd=nb.getChannelData(0);let last=0;
  for(let i=0;i<nd.length;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;nd[i]=w*.5+last*3}
  const rs=c.createBufferSource();rs.buffer=nb;rs.loop=true;
  const bp=c.createBiquadFilter();bp.type='lowpass';bp.frequency.value=2600;const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=380;
  AU.rain=c.createGain();AU.rain.gain.value=0;rs.connect(bp);bp.connect(hp);hp.connect(AU.rain);AU.rain.connect(AU.comp);rs.start();
  // 형광등 웅웅거림 (독서실)
  AU.hum=c.createGain();AU.hum.gain.value=0;AU.hum.connect(AU.comp);
  [120,240,360].forEach((f,i)=>{const o=c.createOscillator();o.frequency.value=f;const g=c.createGain();g.gain.value=[.5,.22,.08][i];o.connect(g);g.connect(AU.hum);o.start()});
  return true;
}
function auStart(){if(!auInit())return;if(AU.ctx.state==='suspended')AU.ctx.resume();if(!AU.started){AU.started=true;AU.nextBeat=AU.ctx.currentTime+.1;AU.timer=setInterval(sched,60)}scene()}
function ramp(g,v,t=1.2){if(!g)return;const n=AU.ctx.currentTime;g.gain.cancelScheduledValues(n);g.gain.setValueAtTime(g.gain.value,n);g.gain.linearRampToValueAtTime(v,n+t)}
// 장면별 섞기
const MIX={'':[.55,0,0],study:[0,0,.05],alley:[.42,.16,0],shrine:[.55,.12,0],hall:[.3,.07,0],room:[.5,.1,0],oneroom:[.5,0,0]};
function scene(){
  if(!AU.ctx)return;const titleOn=$('title').classList.contains('on'),endOn=$('end').classList.contains('on');
  const m=titleOn?[.5,0,0]:endOn?[.45,0,0]:(MIX[st.bg]||MIX['']);
  ramp(AU.music,m[0],2.5);ramp(AU.rain,titleOn?0:(st.rain?Math.max(m[1],.08):0),1.5);ramp(AU.hum,titleOn?0:m[2],1.5);
  clearInterval(AU.tick);if(!titleOn&&st.bg==='study')AU.tick=setInterval(()=>blip(2400,.012,.05,'square'),1000);
  if(st.call&&!AU.ring){AU.ring=setInterval(ringOnce,2600);ringOnce()}else if(!st.call&&AU.ring){clearInterval(AU.ring);AU.ring=null}
}
// 배경음악: A단조, Am F C G / Am F Dm E, 느린 아르페지오 + 패드 + 종소리 선율
const CH=[[57,60,64],[53,57,60],[48,55,60],[55,59,62],[57,60,64],[53,57,60],[50,57,62],[52,56,59]];
const MEL=[76,,74,,72,,,,72,,71,,67,,,,69,,72,,76,,74,,72,,,,71,,,,
           76,,79,,77,,76,,74,,72,,74,,,,72,,71,,69,,,,68,,,,,,,,];
const BEAT=60/62/2;
function sched(){
  const c=AU.ctx;while(AU.nextBeat<c.currentTime+.4){
    const s=AU.step,t=AU.nextBeat,bar=Math.floor(s/8)%8,ch=CH[bar];
    if(s%8===0){ch.forEach(n=>pad(N(n),t,BEAT*8));bass(N(ch[0]-12),t,BEAT*8)}
    arp(N(ch[[0,1,2,1,0,2,1,2][s%8]]+12),t);
    const m=MEL[s%64];if(m)bell(N(m),t);
    AU.step++;AU.nextBeat+=BEAT}
}
function env(g,t,a,peak,d){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function pad(f,t,dur){const c=AU.ctx,g=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;
  [-6,6].forEach(dt=>{const o=c.createOscillator();o.type='triangle';o.frequency.value=f;o.detune.value=dt;o.connect(lp);o.start(t);o.stop(t+dur+.5)});
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+1.2);g.gain.linearRampToValueAtTime(.035,t+dur-.4);g.gain.linearRampToValueAtTime(0,t+dur+.4);lp.connect(g);g.connect(AU.music)}
function bass(f,t,dur){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(AU.music);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.09,t+.3);g.gain.linearRampToValueAtTime(0,t+dur);o.start(t);o.stop(t+dur+.1)}
function arp(f,t){const c=AU.ctx,o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();o.type='square';o.frequency.value=f;lp.type='lowpass';lp.frequency.value=1400;
  o.connect(lp);lp.connect(g);g.connect(AU.music);env(g,t,.005,.018,.5);o.start(t);o.stop(t+.6)}
function bell(f,t){const c=AU.ctx,g=c.createGain();g.connect(AU.music);env(g,t,.004,.07,2.2);
  [[1,1],[2.76,.25],[5.4,.08]].forEach(([r,a])=>{const o=c.createOscillator(),gg=c.createGain();o.frequency.value=f*r;gg.gain.value=a;o.connect(gg);gg.connect(g);o.start(t);o.stop(t+2.4)})}
// 효과음
function blip(f,v=.04,d=.05,type='sine',when=0){if(!AU.ctx||!AU.on)return;const c=AU.ctx,t=c.currentTime+when,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(AU.sfx);env(g,t,.003,v,d);o.start(t);o.stop(t+d+.05)}
function noiseHit(v,d,freq,when=0,q=1){if(!AU.ctx||!AU.on)return;const c=AU.ctx,t=c.currentTime+when,b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),x=b.getChannelData(0);
  for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/x.length,4);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=b;f.type='bandpass';f.frequency.value=freq;f.Q.value=q;g.gain.value=v;s.connect(f);f.connect(g);g.connect(AU.sfx);s.start(t)}
function ringOnce(){for(let k=0;k<2;k++){const w=k*.45;[0,.12,.24].forEach(d=>{blip(1320,.035,.09,'triangle',w+d);blip(1660,.025,.09,'triangle',w+d+.06)})}}
const SFX={
  buzz(){for(let k=0;k<2;k++){if(!AU.ctx)return;const c=AU.ctx,t=c.currentTime+k*.5,o=c.createOscillator(),l=c.createOscillator(),lg=c.createGain(),g=c.createGain();
    o.type='square';o.frequency.value=150;l.frequency.value=32;lg.gain.value=.012;l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(AU.sfx);
    g.gain.setValueAtTime(.018,t);g.gain.setValueAtTime(0,t+.32);o.start(t);l.start(t);o.stop(t+.35);l.stop(t+.35)}},
  knock(){noiseHit(.9,.12,900,0,2);noiseHit(.9,.12,850,.38,2);blip(180,.08,.08,'sine');blip(170,.08,.08,'sine',.38)},
  appear(){[69,72,76,81].forEach((m,i)=>blip(N(m+12),.03,1.4,'sine',i*.09))},
  named(){[76,81,84,88,93].forEach((m,i)=>blip(N(m),.045,1.8,'sine',i*.07));noiseHit(.15,1.2,6000,0,.5)},
  glitch(){for(let k=0;k<6;k++){noiseHit(.5,.05,400+Math.random()*3000,k*.06,4);blip(80+Math.random()*200,.05,.04,'square',k*.06)}},
  choice(){blip(N(81),.04,.25,'triangle');blip(N(88),.035,.35,'triangle',.08)},
  pick(){blip(N(76),.05,.12,'square');blip(N(84),.04,.2,'triangle',.05)},
  tick(){blip(1800,.03,.03,'square')},
  door(){noiseHit(.6,.35,200,0,.7);blip(90,.1,.25,'sine')},
  end(){[57,64,69,72,76].forEach((m,i)=>blip(N(m),.04,3,'triangle',i*.12))}
};
function sfx(k){if(AU.ctx&&AU.on&&SFX[k])SFX[k]()}
let typeN=0;function typeBlip(){if(++typeN%3===0)blip(620+Math.random()*60,.012,.03,'triangle')}
function setSound(on){AU.on=on;try{localStorage.setItem('hr-sound',on?'on':'off')}catch(e){}$('bSnd').classList.toggle('on',on);if(AU.ctx)ramp(AU.master,on?.9:0,.3)}
addEventListener('pointerdown',()=>{auStart()},{once:true});
addEventListener('keydown',()=>{auStart()},{once:true});

/* ---- 픽셀 타이틀 화면 ---- */
const tcv=$('tcv'),tc=tcv.getContext('2d');
let TW=320,TH=180,tBg=null,tLogo=null,tStars=[],tRain=[],tLast=0,tFrame=0,logoY=0;
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const rnd=(()=>{let x=7;return()=>{x=(x*16807)%2147483647;return x/2147483647}})();
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function dpick(pal,v,x,y){const n=pal.length-1,f=Math.max(0,Math.min(n,v*n)),i=Math.floor(f),fr=f-i;return pal[Math.min(n,i+(fr>(BAYER[(y&3)*4+(x&3)]+.5)/16?1:0))]}
function makeBg(){
  const c=document.createElement('canvas');c.width=TW;c.height=TH;const g=c.getContext('2d'),im=g.createImageData(TW,TH),d=im.data;
  const sky=['#020309','#040814','#081126','#0d1b3a','#132650'].map(hex),moon=['#0c1a38','#18305e','#2d5291','#5279bb','#93b6e4'].map(hex);
  const portrait=TH>TW,mx=TW/2,my=portrait?TH*.3:TH*.36,R=portrait?TW*.34:TW*.18,lx=-.55,ly=-.65;
  const craters=[[-.3,-.1,.16],[.25,.2,.12],[.05,-.42,.09],[-.1,.38,.1],[.42,-.25,.07]];
  for(let y=0;y<TH;y++)for(let x=0;x<TW;x++){
    const dx=(x-mx)/R,dy=(y-my)/R,r2=dx*dx+dy*dy;let col;
    if(r2<=1){const dz=Math.sqrt(1-r2);let l=.35+.65*Math.max(0,(-dx*lx-dy*ly)*.6+dz*.55);for(const[cx,cy,cr]of craters){const e=((dx-cx)**2+(dy-cy)**2)/(cr*cr);if(e<1)l-=.18*(1-e)}col=dpick(moon,Math.max(0,Math.min(1,l)),x,y)}
    else{let v=.15+.75*(y/TH);const h=Math.sqrt(r2);if(h<1.5)v+=.3*(1.5-h);col=dpick(sky,Math.min(1,v),x,y)}
    const k=(y*TW+x)*4;d[k]=col[0];d[k+1]=col[1];d[k+2]=col[2];d[k+3]=255}
  g.putImageData(im,0,0);
  const base=Math.round(TH*.86);g.fillStyle='#03060f';
  let x=0;while(x<TW){const w=6+Math.floor(rnd()*12),h=6+Math.floor(rnd()*(portrait?40:22));g.fillRect(x,base-h,w,TH-base+h);
    g.fillStyle='#3f66a6';for(let wy=base-h+3;wy<base-2;wy+=4)for(let wx=x+2;wx<x+w-2;wx+=3)if(rnd()<.12)g.fillRect(wx,wy,1,1);g.fillStyle='#03060f';x+=w}
  const sx=Math.round(TW*(portrait?.18:.22)),sy=base-3;
  for(let i=0;i<9;i++)g.fillRect(sx-14+i*2,sy-18+Math.round(i*.6),40-i*4+i*2,1);
  g.fillRect(sx-8,sy-16,40,3);g.fillRect(sx-4,sy-13,2,14);g.fillRect(sx+24,sy-11,2,12);
  for(let i=0;i<3;i++)g.fillRect(sx-10-i*3,sy-1+i*2,48+i*6,2);
  return c;
}
function makeLogo(){
  const portrait=TH>TW,lines=portrait?['네가 보는','동안만']:['네가 보는 동안만'];
  const fs=portrait?Math.round(TW*.15):Math.round(TW*.082),c=document.createElement('canvas'),g=c.getContext('2d');
  const font=`700 ${fs}px "Gowun Batang","Nanum Myeongjo",serif`;g.font=font;
  const w=Math.max(...lines.map(l=>g.measureText(l).width)),lh=Math.round(fs*1.12);
  c.width=Math.ceil(w+fs*.6+12);c.height=lh*lines.length+Math.round(fs*.5);
  g.font=font;g.textBaseline='alphabetic';g.lineJoin='round';
  lines.forEach((ln,i)=>{
    const lw=g.measureText(ln).width,x=Math.round((c.width-lw)/2+fs*.12),y=Math.round(fs*.95+i*lh);
    g.setTransform(1,0,-.14,1,fs*.12,0);
    for(let k=4;k>=1;k--){g.fillStyle=k>2?'#020611':'#06102a';g.fillText(ln,x+k,y+k)}
    g.lineWidth=4;g.strokeStyle='#0b1a42';g.strokeText(ln,x,y);
    g.lineWidth=2;g.strokeStyle='#28509c';g.strokeText(ln,x,y);
    const gr=g.createLinearGradient(0,y-fs*.82,0,y+fs*.12);
    gr.addColorStop(0,'#ffffff');gr.addColorStop(.42,'#d6e9ff');gr.addColorStop(.46,'#ffffff');gr.addColorStop(.5,'#8db6ee');gr.addColorStop(1,'#3c69bd');
    g.fillStyle=gr;g.fillText(ln,x,y);g.setTransform(1,0,0,1,0,0)});
  const im=g.getImageData(0,0,c.width,c.height),d=im.data;for(let k=3;k<d.length;k+=4)d[k]=d[k]<110?0:255;g.putImageData(im,0,0);
  return c;
}
function titleLayout(){
  const vw=innerWidth,vh=innerHeight;TW=vw>=vh?320:200;TH=Math.round(TW*vh/vw);tcv.width=TW;tcv.height=TH;
  tBg=makeBg();tLogo=makeLogo();
  logoY=Math.round((TH>TW?TH*.3:TH*.36)-tLogo.height/2);
  $('title').style.setProperty('--menu-top',Math.round((logoY+tLogo.height+(TH>TW?34:22))/TH*100)+'%');
  tStars=Array.from({length:TH>TW?22:18},()=>({x:Math.floor(rnd()*TW),y:Math.floor(rnd()*TH*.8),p:Math.floor(rnd()*8)}));
  tRain=Array.from({length:Math.round(TW*TH/700)},()=>({x:rnd()*TW,y:rnd()*TH,v:3+rnd()*2}));
}
function star(x,y,s){tc.fillStyle='#7fb0f0';if(s>=1){tc.fillRect(x-1,y,3,1);tc.fillRect(x,y-1,1,3)}if(s>=2){tc.fillRect(x-3,y,7,1);tc.fillRect(x,y-3,1,7);tc.fillStyle='#cfe5ff';tc.fillRect(x-1,y,3,1);tc.fillRect(x,y-1,1,3)}tc.fillStyle='#f2f8ff';tc.fillRect(x,y,1,1)}
function drawTitle(t){
  if(!$('title').classList.contains('on')){requestAnimationFrame(drawTitle);return}
  if(t-tLast>90||!tLast){tLast=t;tFrame++;
    tc.drawImage(tBg,0,0);
    const by=logoY+Math.round(tLogo.height*.45);tc.fillStyle='rgba(110,160,240,.10)';tc.fillRect(0,by-10,TW,20);tc.fillStyle='rgba(150,195,255,.10)';tc.fillRect(0,by-4,TW,8);tc.fillStyle='rgba(190,220,255,.18)';tc.fillRect(0,by,TW,1);
    tc.fillStyle='rgba(120,160,230,.55)';
    for(const r of tRain){tc.fillRect(Math.round(r.x),Math.round(r.y),1,3);if(!reduceRain){r.y+=r.v;r.x-=.6;if(r.y>TH){r.y=-4;r.x=rnd()*(TW+20)}}}
    for(const s of tStars){const ph=(s.p+tFrame)%8;star(s.x,s.y,ph<3?ph:ph<5?2-(ph-3):0)}
    tc.drawImage(tLogo,Math.round((TW-tLogo.width)/2),logoY);
    tc.font='8px "Press Start 2P",monospace';tc.textAlign='center';tc.lineWidth=3;tc.strokeStyle='#030714';tc.strokeText('WHILE YOU SEE ME',TW/2,logoY-4);tc.fillStyle='#bcd6f7';tc.fillText('WHILE YOU SEE ME',TW/2,logoY-4);
  }
  requestAnimationFrame(drawTitle);
}
const reduceRain=matchMedia('(prefers-reduced-motion:reduce)').matches;
titleLayout();addEventListener('resize',titleLayout);
if(document.fonts){document.fonts.load('700 20px "Gowun Batang"').then(()=>{tLogo=makeLogo();tLast=0}).catch(()=>{});document.fonts.load('8px "Press Start 2P"').then(()=>{tLast=0}).catch(()=>{})}
requestAnimationFrame(drawTitle);
function pressStart(e){const t=$('title');if(!t.classList.contains('wait'))return;if(e)e.stopPropagation();t.classList.remove('wait');auStart();sfx('pick');setTimeout(()=>$('bNew').focus({preventScroll:true}),30)}
$('title').addEventListener('pointerdown',pressStart);
addEventListener('keydown',e=>{if($('title').classList.contains('wait')){e.preventDefault();pressStart()}},true);
fit();
$('bSnd').classList.toggle('on',AU.on);
$('title').addEventListener('keydown',e=>{if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;const bs=[...document.querySelectorAll('.tmenu button:not([hidden])')];const i=bs.indexOf(document.activeElement);bs.at((i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length).focus();e.preventDefault()});
const cv=$('rain'),cx=cv.getContext('2d');let drops=[];
const rs=()=>{const sc=$('scene');cv.width=sc.clientWidth*2;cv.height=sc.clientHeight*2;drops=Array.from({length:Math.round(sc.clientWidth/5)},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,v:14+Math.random()*12,l:14+Math.random()*22}))};
addEventListener('resize',rs);rs();
(function loop(){
  if(st.rain){cx.clearRect(0,0,cv.width,cv.height);cx.strokeStyle='rgba(180,210,255,.32)';cx.lineWidth=1.2*devicePixelRatio;cx.beginPath();
    for(const d of drops){cx.moveTo(d.x,d.y);cx.lineTo(d.x-d.l*.18,d.y+d.l*devicePixelRatio);if(!reduceRain){d.y+=d.v*devicePixelRatio;d.x-=d.v*.18;if(d.y>cv.height){d.y=-30;d.x=Math.random()*cv.width*1.1}}}cx.stroke()}
  requestAnimationFrame(loop)})();
}
